name: Build and publish wheels

"on":
  workflow_dispatch:
    inputs:
      publish_artifacts_run_id:
        description: "Existing workflow run ID containing openqp-* artifacts to publish"
        required: false
        type: string
      release_tag:
        description: "Release tag to publish when publishing existing artifacts"
        required: false
        type: string
  # Run the smoke build on pushes to main so the bundled-externals cache is
  # populated on the DEFAULT branch. GitHub Actions caches are branch-scoped: a
  # PR branch can only restore caches from its own branch or from main, and the
  # wheel build otherwise never ran on main -- so every fresh PR cold-rebuilt all
  # externals (incl. ~15 min of reference LAPACK). Warming it here lets PRs
  # restore via the restore-keys prefix instead.
  push:
    branches: [main]
    paths:
      - ".github/workflows/build_wheels.yml"
      - "CMakeLists.txt"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "basis_sets/**"
      - "cmake/**"
      - "external/**"
      - "include/**"
      - "pyoqp/**"
      - "source/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - ".github/workflows/build_wheels.yml"
      - "CMakeLists.txt"
      - "MANIFEST.in"
      - "pyproject.toml"
      - "basis_sets/**"
      - "cmake/**"
      - "external/**"
      - "include/**"
      - "pyoqp/**"
      - "source/**"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_sdist:
    name: Build source distribution
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_artifacts_run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: openqp-sdist
          path: dist/*
          if-no-files-found: error

  build_wheel_smoke:
    name: Build Linux wheel smoke
    # Runs on PRs, and on pushes to main to warm the bundled-externals cache.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'release'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache bundled externals
        uses: actions/cache@v4
        with:
          path: .cache/openqp/externals
          key: oqp-wheel-externals-linux-x86_64-${{ hashFiles('external/CMakeLists.txt', 'CMakeLists.txt', 'pyproject.toml') }}
          restore-keys: |
            oqp-wheel-externals-linux-x86_64-

      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel

      # The externals are built INSIDE the cibuildwheel container; without a
      # bind mount they live only in the container fs (cibuildwheel copies out
      # just the wheels), so the host .cache that actions/cache saves stays
      # empty and the cache never works. Create the host dir (runner-owned) and
      # bind-mount it into the container below so the externals persist.
      - name: Prepare externals cache mount
        run: mkdir -p "${{ github.workspace }}/.cache/openqp/externals"

      - name: Build smoke wheel
        env:
          CIBW_PLATFORM: linux
          CIBW_ARCHS: x86_64
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_CONTAINER_ENGINE: >-
            docker; create_args: --volume ${{ github.workspace }}/.cache:/host-cache
          # Native-BLAS policy for Linux wheels: bundle an ILP64 OpenBLAS built
          # here (plain Fortran symbols, INTERFACE64=1, DYNAMIC_ARCH for runtime
          # CPU dispatch -- the scipy/numpy approach). MKL is the source-build
          # mandate on Linux x86_64 but cannot ship in PyPI wheels (libmkl_core
          # alone exceeds PyPI's per-file size limit), so wheels pin OpenBLAS
          # ILP64 explicitly -- deterministic, and exactly what CI tests.
          # Installed under the bind-mounted externals cache so actions/cache
          # persists it; rebuilt only when absent. gcc-toolset (gfortran) already
          # ships in the manylinux image.
          CIBW_BEFORE_ALL: |
            set -e
            P=/host-cache/openqp/externals/openblas64
            if [ ! -e "$P/lib/libopenblas.so" ]; then
              git clone --depth 1 --branch v0.3.30 https://github.com/OpenMathLib/OpenBLAS.git /tmp/OpenBLAS
              make -C /tmp/OpenBLAS -j"$(nproc)" INTERFACE64=1 USE_OPENMP=1 DYNAMIC_ARCH=1 NO_STATIC=1 libs netlib shared
              make -C /tmp/OpenBLAS PREFIX="$P" INTERFACE64=1 USE_OPENMP=1 DYNAMIC_ARCH=1 NO_STATIC=1 install
            fi
          CIBW_ENVIRONMENT: >-
            XDG_CACHE_HOME=/host-cache
            PKG_CONFIG_PATH=/host-cache/openqp/externals/openblas64/lib/pkgconfig
            CMAKE_ARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
            -DLINALG_LIB=OpenBLAS
            -DLINALG_LIB_INT64=ON"
          CIBW_REPAIR_WHEEL_COMMAND: >-
            LD_LIBRARY_PATH="oqp/lib:/host-cache/openqp/externals/openblas64/lib:$LD_LIBRARY_PATH"
            auditwheel repair -w {dest_dir} {wheel}
          # Real numerical test: RHF/STO-3G h2 with energy + basis-metadata ABI
          # asserts (see the script header for the failure classes this guards).
          CIBW_TEST_COMMAND: >-
            python {project}/.github/scripts/wheel_smoke_test.py {project}
        run: python -m cibuildwheel --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: openqp-wheel-smoke-linux-x86_64
          path: dist/*
          if-no-files-found: error

  build_wheels:
    name: Build wheels (${{ matrix.name }})
    # Full matrix only for releases / a release-labelled PR / manual dispatch --
    # NOT for plain pushes to main (those only warm the cache via the smoke job).
    if: >-
      github.event_name == 'release'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'release'))
      || (github.event_name == 'workflow_dispatch'
          && github.event.inputs.publish_artifacts_run_id == '')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux wheels bundle an ILP64 OpenBLAS built in CIBW_BEFORE_ALL
          # (plain Fortran symbols, DYNAMIC_ARCH runtime CPU dispatch; the
          # scipy/numpy approach), installed under the bind-mounted externals
          # cache so it persists across runs. MKL is the source-build mandate on
          # Linux x86_64 but cannot ship in PyPI wheels (libmkl_core alone
          # exceeds PyPI's per-file size limit), so wheels pin OpenBLAS ILP64
          # explicitly -- deterministic, and exactly the BLAS that CI tests.
          - name: linux-x86_64
            os: ubuntu-24.04
            platform: linux
            archs: x86_64
            cache_path: .cache/openqp/externals
            # Bind-mount the host cache into the build container so the externals
            # built inside it persist for actions/cache (see smoke job comment).
            container_engine: >-
              docker; create_args: --volume ${{ github.workspace }}/.cache:/host-cache
            before_all: |
              set -e
              P=/host-cache/openqp/externals/openblas64
              if [ ! -e "$P/lib/libopenblas.so" ]; then
                git clone --depth 1 --branch v0.3.30 https://github.com/OpenMathLib/OpenBLAS.git /tmp/OpenBLAS
                make -C /tmp/OpenBLAS -j"$(nproc)" INTERFACE64=1 USE_OPENMP=1 DYNAMIC_ARCH=1 NO_STATIC=1 libs netlib shared
                make -C /tmp/OpenBLAS PREFIX="$P" INTERFACE64=1 USE_OPENMP=1 DYNAMIC_ARCH=1 NO_STATIC=1 install
              fi
            environment: >-
              XDG_CACHE_HOME=/host-cache
              PKG_CONFIG_PATH=/host-cache/openqp/externals/openblas64/lib/pkgconfig
              CMAKE_ARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
              -DLINALG_LIB=OpenBLAS
              -DLINALG_LIB_INT64=ON"
            repair: >-
              LD_LIBRARY_PATH="oqp/lib:/host-cache/openqp/externals/openblas64/lib:$LD_LIBRARY_PATH"
              auditwheel repair -w {dest_dir} {wheel}

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux
            archs: aarch64
            cache_path: .cache/openqp/externals
            container_engine: >-
              docker; create_args: --volume ${{ github.workspace }}/.cache:/host-cache
            before_all: |
              set -e
              P=/host-cache/openqp/externals/openblas64
              if [ ! -e "$P/lib/libopenblas.so" ]; then
                git clone --depth 1 --branch v0.3.30 https://github.com/OpenMathLib/OpenBLAS.git /tmp/OpenBLAS
                make -C /tmp/OpenBLAS -j"$(nproc)" INTERFACE64=1 USE_OPENMP=1 DYNAMIC_ARCH=1 NO_STATIC=1 libs netlib shared
                make -C /tmp/OpenBLAS PREFIX="$P" INTERFACE64=1 USE_OPENMP=1 DYNAMIC_ARCH=1 NO_STATIC=1 install
              fi
            environment: >-
              XDG_CACHE_HOME=/host-cache
              PKG_CONFIG_PATH=/host-cache/openqp/externals/openblas64/lib/pkgconfig
              CMAKE_ARGS="-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
              -DLINALG_LIB=OpenBLAS
              -DLINALG_LIB_INT64=ON"
            repair: >-
              LD_LIBRARY_PATH="oqp/lib:/host-cache/openqp/externals/openblas64/lib:$LD_LIBRARY_PATH"
              auditwheel repair -w {dest_dir} {wheel}

          # macOS wheels use the native-BLAS policy backend: Apple Accelerate's
          # modern ILP64 interface ($NEWLAPACK$ILP64 symbol interposition) --
          # the same 8-byte integer model as the Linux wheels, no LP64 special
          # case. Accelerate is a system framework, so delocate does not bundle
          # any BLAS and the wheels stay small; the ILP64 interface needs
          # macOS >= 13.3, well below the 15.0 deployment target. LINALG_LIB
          # and INT64 are what defaults resolve to on macOS; pinned explicitly
          # so the shipped artifact never depends on resolution logic.
          - name: macos-x86_64
            os: macos-15-intel
            platform: macos
            archs: x86_64
            cache_path: ~/Library/Caches/openqp/externals
            container_engine: "docker"
            before_all: brew install gcc@15
            environment: >-
              MACOSX_DEPLOYMENT_TARGET=15.0
              CMAKE_ARGS="-DCMAKE_C_COMPILER=gcc-15
              -DCMAKE_CXX_COMPILER=g++-15
              -DCMAKE_Fortran_COMPILER=gfortran-15
              -DLINALG_LIB=Apple
              -DLINALG_LIB_INT64=ON"
            repair: >-
              delocate-wheel --require-archs {delocate_archs}
              -w {dest_dir} -v {wheel}

          - name: macos-arm64
            os: macos-15
            platform: macos
            archs: arm64
            cache_path: ~/Library/Caches/openqp/externals
            container_engine: "docker"
            before_all: brew install gcc@15
            environment: >-
              MACOSX_DEPLOYMENT_TARGET=15.0
              CMAKE_ARGS="-DCMAKE_C_COMPILER=gcc-15
              -DCMAKE_CXX_COMPILER=g++-15
              -DCMAKE_Fortran_COMPILER=gfortran-15
              -DLINALG_LIB=Apple
              -DLINALG_LIB_INT64=ON"
            repair: >-
              delocate-wheel --require-archs {delocate_archs}
              -w {dest_dir} -v {wheel}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache bundled externals
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache_path }}
          key: oqp-wheel-externals-${{ matrix.name }}-${{ hashFiles('external/CMakeLists.txt', 'CMakeLists.txt', 'pyproject.toml') }}
          restore-keys: |
            oqp-wheel-externals-${{ matrix.name }}-

      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel

      # Linux legs bind-mount the host cache into the build container (see the
      # smoke job); create the host dir runner-owned first. No-op on macOS.
      - name: Prepare externals cache mount
        if: ${{ matrix.platform == 'linux' }}
        run: mkdir -p "${{ github.workspace }}/.cache/openqp/externals"

      - name: Build wheels
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_CONTAINER_ENGINE: ${{ matrix.container_engine }}
          CIBW_BEFORE_ALL: ${{ matrix.before_all }}
          CIBW_ENVIRONMENT: ${{ matrix.environment }}
          CIBW_REPAIR_WHEEL_COMMAND: ${{ matrix.repair }}
          # Real numerical test on every wheel: RHF/STO-3G h2 with energy and
          # basis-metadata integer-ABI asserts (see the script header for the
          # two failure classes this guards -- both previously shipped in wheels
          # while a bare `import oqp` still succeeded).
          CIBW_TEST_COMMAND: >-
            python {project}/.github/scripts/wheel_smoke_test.py {project}
        run: python -m cibuildwheel --output-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: openqp-wheels-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  verify_release_version:
    name: Verify release tag matches pyproject version
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(
                  f"Release tag {tag!r} does not match pyproject.toml version {version!r}. "
                  f"Expected {expected!r}."
              )
          print(f"Release tag matches OpenQP version {version}.")
          PY

  publish:
    name: Publish release artifacts
    if: github.event_name == 'release'
    needs:
      - build_sdist
      - build_wheels
      - verify_release_version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/openqp
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: openqp-*
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish_existing_artifacts:
    name: Publish existing release artifacts
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_artifacts_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/openqp
    steps:
      - name: Validate publish inputs
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          test -n "$RELEASE_TAG" || {
            echo "release_tag is required when publish_artifacts_run_id is set."
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: openqp-*
          path: dist
          merge-multiple: true
          run-id: ${{ github.event.inputs.publish_artifacts_run_id }}
          github-token: ${{ github.token }}

      - name: Show artifacts
        run: ls -lh dist

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
