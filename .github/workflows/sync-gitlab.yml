name: Sync GitHub main to GitLab

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-github-main-to-gitlab
  cancel-in-progress: false

jobs:
  sync:
    name: Create GitLab sync merge request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLAB_PROJECT_ID: "17"
      GITLAB_PROJECT_URL: https://qchemlab.knu.ac.kr/open-quantum-platform/openqp.git
      GITLAB_API_URL: https://qchemlab.knu.ac.kr/api/v4
      GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
    steps:
      - name: Check out the GitHub revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push an immutable sync branch and open a GitLab merge request
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::error::GITLAB_SYNC_TOKEN is not configured"
            exit 1
          fi

          auth=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)
          git_auth=(-c "http.extraHeader=Authorization: Basic $auth")

          git "${git_auth[@]}" fetch --no-tags "$GITLAB_PROJECT_URL" \
            main:refs/remotes/gitlab/main

          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/gitlab/main; then
            echo "GitLab main already contains GitHub $GITHUB_SHA; nothing to sync."
            exit 0
          fi

          sync_branch="github-sync/$GITHUB_SHA"
          git "${git_auth[@]}" push "$GITLAB_PROJECT_URL" \
            "$GITHUB_SHA:refs/heads/$sync_branch"

          existing_iid=$(curl --fail --silent --show-error --get \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "state=opened" \
            --data-urlencode "source_branch=$sync_branch" \
            --data-urlencode "target_branch=main" \
            "$GITLAB_API_URL/projects/$GITLAB_PROJECT_ID/merge_requests" |
            jq -r '.[0].iid // empty')

          if [ -n "$existing_iid" ]; then
            mr_iid=$existing_iid
            echo "GitLab merge request !$mr_iid already exists."
          else
            short_sha=${GITHUB_SHA:0:12}
            mr_iid=$(curl --fail --silent --show-error --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "source_branch=$sync_branch" \
              --data-urlencode "target_branch=main" \
              --data-urlencode "title=Sync GitHub main at $short_sha" \
              --data-urlencode "description=Automated inbound synchronization from https://github.com/Open-Quantum-Platform/openqp/commit/$GITHUB_SHA. GitLab CI remains the merge gate." \
              --data-urlencode "remove_source_branch=true" \
              "$GITLAB_API_URL/projects/$GITLAB_PROJECT_ID/merge_requests" |
              jq -r '.iid')
            echo "Created GitLab merge request !$mr_iid."
          fi

          curl --fail --silent --show-error --request PUT \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "auto_merge=true" \
            --data-urlencode "should_remove_source_branch=true" \
            --data-urlencode "sha=$GITHUB_SHA" \
            "$GITLAB_API_URL/projects/$GITLAB_PROJECT_ID/merge_requests/$mr_iid/merge" \
            >/dev/null
          echo "Enabled auto-merge for GitLab merge request !$mr_iid."
