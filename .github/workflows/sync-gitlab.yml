name: Sync GitHub main to GitLab

"on":
  push:
    branches: [main]
  schedule:
    # Reconcile after an extended GitLab outage even if the push-triggered run
    # exhausted its bounded retries.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-github-main-to-gitlab
  cancel-in-progress: false

jobs:
  sync:
    name: Create GitLab sync merge request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLAB_PROJECT_ID: "17"
      GITLAB_PROJECT_URL: https://qchemlab.knu.ac.kr/open-quantum-platform/openqp.git
      GITLAB_API_URL: https://qchemlab.knu.ac.kr/api/v4
      GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
    steps:
      - name: Check out the GitHub revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push an immutable sync branch and open a GitLab merge request
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GITLAB_TOKEN:-}" ]; then
            echo "::error::GITLAB_SYNC_TOKEN is not configured"
            exit 1
          fi

          auth=$(printf 'oauth2:%s' "$GITLAB_TOKEN" | base64 -w0)
          git_auth=(-c "http.extraHeader=Authorization: Basic $auth")

          retry_gitlab_network() {
            local attempt delay rc error_log
            error_log=$(mktemp)

            for attempt in 1 2 3 4 5; do
              : >"$error_log"
              if "$@" 2>"$error_log"; then
                rm -f "$error_log"
                return 0
              else
                rc=$?
              fi
              cat "$error_log" >&2

              if ! grep -Eiq \
                'Could not resolve host|Failed to connect|Connection timed out|Operation timed out|Connection reset by peer|Recv failure|Send failure|TLS|SSL connection|unexpected EOF|remote end hung up unexpectedly|requested URL returned error: (429|5[0-9]{2})' \
                "$error_log"; then
                rm -f "$error_log"
                return "$rc"
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "::error::GitLab network operation still failed after $attempt attempts"
                rm -f "$error_log"
                return "$rc"
              fi

              delay=$((attempt * 5))
              echo "::warning::Transient GitLab network failure; retrying in ${delay}s ($attempt/5)"
              sleep "$delay"
            done
          }

          curl_retry=(
            --retry 4
            --retry-all-errors
            --retry-delay 3
            --retry-max-time 45
          )

          retry_gitlab_network git "${git_auth[@]}" fetch --no-tags "$GITLAB_PROJECT_URL" \
            main:refs/remotes/gitlab/main

          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/gitlab/main; then
            echo "GitLab main already contains GitHub $GITHUB_SHA; nothing to sync."
            exit 0
          fi

          sync_branch="github-sync/$GITHUB_SHA"
          retry_gitlab_network git "${git_auth[@]}" push "$GITLAB_PROJECT_URL" \
            "$GITHUB_SHA:refs/heads/$sync_branch"

          mr_list_response=$(mktemp)
          merge_response=$(mktemp)
          trap 'rm -f "$mr_list_response" "$merge_response"' EXIT

          curl "${curl_retry[@]}" --fail --silent --show-error --get \
            --output "$mr_list_response" \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "state=opened" \
            --data-urlencode "source_branch=$sync_branch" \
            --data-urlencode "target_branch=main" \
            "$GITLAB_API_URL/projects/$GITLAB_PROJECT_ID/merge_requests"
          existing_iid=$(jq -r '.[0].iid // empty' "$mr_list_response")

          if [ -n "$existing_iid" ]; then
            mr_iid=$existing_iid
            echo "GitLab merge request !$mr_iid already exists."
          else
            short_sha=${GITHUB_SHA:0:12}
            mr_iid=$(curl --fail --silent --show-error --request POST \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "source_branch=$sync_branch" \
              --data-urlencode "target_branch=main" \
              --data-urlencode "title=Sync GitHub main at $short_sha" \
              --data-urlencode "description=Automated inbound synchronization from https://github.com/Open-Quantum-Platform/openqp/commit/$GITHUB_SHA. GitLab CI remains the merge gate." \
              --data-urlencode "remove_source_branch=true" \
              "$GITLAB_API_URL/projects/$GITLAB_PROJECT_ID/merge_requests" |
              jq -r '.iid')
            echo "Created GitLab merge request !$mr_iid."
          fi

          # GitLab can briefly report a newly created MR as unmergeable while it
          # prepares the merge ref and creates the MR pipeline. Retry only that
          # transient response; every other API failure remains visible.
          for attempt in $(seq 1 30); do
            http_code=$(curl "${curl_retry[@]}" --silent --show-error \
              --output "$merge_response" \
              --write-out '%{http_code}' \
              --request PUT \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "auto_merge=true" \
              --data-urlencode "should_remove_source_branch=true" \
              --data-urlencode "sha=$GITHUB_SHA" \
              "$GITLAB_API_URL/projects/$GITLAB_PROJECT_ID/merge_requests/$mr_iid/merge")

            if [[ "$http_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Enabled auto-merge for GitLab merge request !$mr_iid."
              exit 0
            fi

            message=$(jq -r '.message // .error // "unknown GitLab response"' \
              "$merge_response")
            if [ "$http_code" != "422" ] || [ "$message" != "Branch cannot be merged" ]; then
              echo "::error::GitLab auto-merge request failed with HTTP $http_code: $message"
              exit 1
            fi

            echo "GitLab is still preparing merge request !$mr_iid; retrying auto-merge ($attempt/30)."
            sleep 10
          done

          echo "::error::GitLab merge request !$mr_iid stayed unmergeable for five minutes."
          exit 1
