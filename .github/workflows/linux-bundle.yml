name: Linux standalone bundle
# Builds a self-contained Linux distribution: untar and run ./openqp.
# No Python, no compiler, no BLAS on the user's machine -- the archive carries
# the interpreter, liboqp.so, the DFT-D4 libraries, an ILP64 OpenBLAS and the
# GCC Fortran runtime.  Meant for machines without a Python environment, for
# clusters where pip is not an option, and for embedding in the GUI
# application.
#
# Built inside manylinux_2_28, not on the runner: a bundle linked against
# ubuntu-24.04's glibc refuses to start on the RHEL/Rocky 8 machines that a lot
# of clusters still run.  This is the same discipline auditwheel enforces for
# the wheels.
on:
  # Not on every push to main: the job takes the better part of an hour.  A
  # weekly run catches a regression within days, and a release always rebuilds.
  schedule:
    - cron: "0 3 * * 0"   # Sundays, 03:00 UTC
  # TEMPORARY, remove when this merges: workflow_dispatch only works once the
  # file is on the default branch, so the only way to exercise a brand-new
  # workflow before then is to run it on its own branch.
  push:
    branches: [feat/windows-intel-build]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  bundle:
    name: openqp-linux-${{ matrix.arch }} (standalone)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - arch: aarch64
            os: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Cache the OpenBLAS and externals trees
        uses: actions/cache@v4
        with:
          path: .cache/openqp
          key: oqp-linux-bundle-${{ matrix.arch }}-${{ hashFiles('external/CMakeLists.txt', 'CMakeLists.txt') }}
          restore-keys: |
            oqp-linux-bundle-${{ matrix.arch }}-

      - name: Build the bundle inside manylinux
        run: |
          mkdir -p "$PWD/.cache/openqp" dist
          docker run --rm \
            -v "$PWD:/src" -v "$PWD/.cache:/host-cache" \
            -e ARCH='${{ matrix.arch }}' \
            -e GITHUB_SHA -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_RUN_ID \
            -e EVENT_NAME='${{ github.event_name }}' \
            ${{ matrix.image }} bash -euo pipefail /src/.github/scripts/build_linux_bundle.sh

      - name: Name the archive
        run: |
          ver=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          built=$(ls dist/openqp-*.tar.gz)
          # A release asset gets the plain, citable name; every other build
          # carries the commit so downloads stay traceable.
          if [ "${{ github.event_name }}" = "release" ]; then
            final="dist/openqp-${ver}-linux-${{ matrix.arch }}.tar.gz"
          else
            final="dist/openqp-${ver}+g$(echo '${{ github.sha }}' | cut -c1-7)-linux-${{ matrix.arch }}.tar.gz"
          fi
          [ "$built" = "$final" ] || mv "$built" "$final"
          echo "BUNDLE_TARBALL=$final" >> "$GITHUB_ENV"
          ls -lh "$final"

      - uses: actions/upload-artifact@v4
        with:
          name: openqp-linux-${{ matrix.arch }}-standalone
          path: ${{ env.BUNDLE_TARBALL }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$BUNDLE_TARBALL" --clobber
