name: Windows Intel (experimental)
# Experimental: build OpenQP on Windows with Intel oneAPI (ifx + icx) and MKL
# ILP64.  Not part of the required CI yet -- runs on this branch and on demand.
on:
  push:
    branches: [feat/windows-intel-build]
  workflow_dispatch:

env:
  # Unified oneAPI 2026.1 offline installer (same URL oneapi-src/oneapi-ci uses).
  ONEAPI_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe
  ONEAPI_COMPONENTS: intel.oneapi.win.ifort-compiler:intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel

jobs:
  windows-intel:
    name: Windows ifx + icx + MKL ILP64
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore oneAPI install from cache
        id: oneapi-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files (x86)\Intel\oneAPI
          key: oneapi-win-${{ env.ONEAPI_URL }}-${{ env.ONEAPI_COMPONENTS }}-v1
      - name: Install Intel oneAPI (ifx + icx + MKL)
        if: steps.oneapi-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl.exe -sSL --retry 5 --retry-delay 5 --output %RUNNER_TEMP%\oneapi.exe %ONEAPI_URL%
          start /b /wait %RUNNER_TEMP%\oneapi.exe -s -x -f %RUNNER_TEMP%\oneapi_ex --log %RUNNER_TEMP%\extract.log
          %RUNNER_TEMP%\oneapi_ex\bootstrapper.exe -s --action install --components=%ONEAPI_COMPONENTS% --eula=accept -p=NEED_VS2017_INTEGRATION=0 -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0 --log-dir=%RUNNER_TEMP%\oneapi_log
          set rc=%ERRORLEVEL%
          rd /s /q %RUNNER_TEMP%\oneapi_ex
          dir "C:\Program Files (x86)\Intel\oneAPI"
          exit /b %rc%
      - name: Save oneAPI install to cache
        # Save right after a successful install, regardless of how the build
        # goes later, so the next run never re-downloads the toolkit.
        if: steps.oneapi-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\Program Files (x86)\Intel\oneAPI
          key: oneapi-win-${{ env.ONEAPI_URL }}-${{ env.ONEAPI_COMPONENTS }}-v1
      - name: Export oneAPI + MSVC environment
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" --force
          set >> %GITHUB_ENV%
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cmake ninja numpy cffi scikit-build-core
      - name: Show toolchain
        run: |
          ifx --version
          icx --version
          cmake --version
          ninja --version
          echo "MKLROOT=$env:MKLROOT"
          Get-ChildItem "$env:MKLROOT\lib" | Where-Object { $_.Name -like 'mkl_intel_ilp64*' -or $_.Name -like 'mkl_core*' -or $_.Name -like 'mkl_intel_thread*' } | Select-Object -ExpandProperty Name
      - name: Build & install OpenQP
        env:
          CC: icx
          CXX: icx
          FC: ifx
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          # Windows caps object-file paths at 250 characters; keep the build
          # tree and the reusable externals cache near the drive root.
          OQP_EXTERNALS_ROOT: C:\oqpx
        run: |
          New-Item -ItemType Directory -Force -Path C:\oqpx, C:\oqpb | Out-Null
          python -m pip install -v . --no-build-isolation `
            --config-settings=build-dir=C:\oqpb `
            --config-settings=cmake.define.LINALG_LIB=Intel10_64ilp `
            --config-settings=cmake.define.ENABLE_MPI=OFF `
            --config-settings=cmake.define.ENABLE_OPENMP=ON `
            --config-settings=cmake.define.USE_LIBINT=OFF `
            --config-settings=cmake.define.ENABLE_OPENTRAH=OFF `
            --config-settings=cmake.define.BUILD_TESTING=OFF
      - name: Inspect installed package
        if: always()
        run: |
          $pkg = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'] + '\oqp')"
          echo "package dir: $pkg"
          Get-ChildItem -Recurse "$pkg\lib" -ErrorAction SilentlyContinue | Select-Object FullName, Length
      - name: Import and run H2O RHF
        run: |
          python -m pip install scipy basis_set_exchange geometric "numpy<2.2"
          python -c "import oqp; print('oqp imported from', oqp.__file__)"
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP\oqp_smoke | Out-Null
          Copy-Item examples\HF\H2O_RHF-HF_ENERGY.inp $env:RUNNER_TEMP\oqp_smoke\hf.inp
          Set-Location $env:RUNNER_TEMP\oqp_smoke
          $env:OMP_NUM_THREADS = "2"
          openqp hf.inp --nompi
          Select-String -Path hf.log -Pattern "TOTAL energy"
