name: Windows Intel (experimental)
# Experimental: build OpenQP on Windows with Intel oneAPI (ifx + icx) and MKL
# ILP64.  Not part of the required CI yet -- runs on this branch and on demand.
on:
  push:
    branches: [feat/windows-intel-build]
  workflow_dispatch:

jobs:
  windows-intel:
    name: Windows ifx + icx + MKL ILP64
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Intel oneAPI (ifx + icx)
        uses: fortran-lang/setup-fortran@v1
        id: toolchain
        with:
          compiler: intel
          version: '2026.1'
      - name: Install MKL (pip mkl-devel) and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkl-devel intel-openmp cmake ninja numpy cffi scikit-build-core
          $prefix = python -c "import sys; print(sys.prefix)"
          echo "MKLROOT=$prefix\Library" >> $env:GITHUB_ENV
          echo "$prefix\Library\bin" >> $env:GITHUB_PATH
          Get-ChildItem "$prefix\Library\lib" | Where-Object { $_.Name -like 'mkl_*' -or $_.Name -like 'libiomp*' } | Select-Object -ExpandProperty Name
      - name: Show toolchain
        run: |
          ifx --version
          icx --version
          cmake --version
          ninja --version
          echo "FC=$env:FC CC=$env:CC CXX=$env:CXX"
          echo "MKLROOT=$env:MKLROOT"
      - name: Build & install OpenQP
        env:
          CC: icx
          CXX: icx
          FC: ifx
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          python -m pip install -v . --no-build-isolation `
            --config-settings=cmake.define.LINALG_LIB=Intel10_64ilp `
            --config-settings=cmake.define.ENABLE_MPI=OFF `
            --config-settings=cmake.define.ENABLE_OPENMP=ON `
            --config-settings=cmake.define.USE_LIBINT=OFF `
            --config-settings=cmake.define.ENABLE_OPENTRAH=OFF `
            --config-settings=cmake.define.BUILD_TESTING=OFF
      - name: Inspect installed package
        if: always()
        run: |
          $pkg = python -c "import os, oqp.runtime as r; print(os.path.dirname(r.__file__))" 2>$null
          if (-not $pkg) { $pkg = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'] + '\oqp')" }
          echo "package dir: $pkg"
          Get-ChildItem -Recurse "$pkg\lib" -ErrorAction SilentlyContinue | Select-Object FullName, Length
      - name: Import and run H2O RHF
        run: |
          python -m pip install scipy basis_set_exchange geometric "numpy<2.2"
          python -c "import oqp; print('oqp imported from', oqp.__file__)"
          New-Item -ItemType Directory -Force -Path $env:RUNNER_TEMP\oqp_smoke | Out-Null
          Copy-Item examples\HF\H2O_RHF-HF_ENERGY.inp $env:RUNNER_TEMP\oqp_smoke\hf.inp
          Set-Location $env:RUNNER_TEMP\oqp_smoke
          $env:OMP_NUM_THREADS = "2"
          openqp hf.inp --nompi
          Select-String -Path hf.log -Pattern "TOTAL energy"
