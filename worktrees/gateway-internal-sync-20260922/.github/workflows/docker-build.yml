name: Build Docker Release Candidate

"on":
  release:
    types:
      - published
  pull_request:
    branches:
      - main

# Build-only: no registry credentials, package write permission, login, push,
# release attachment, retained image artifact, or exported build cache.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # build-push-action v6 otherwise uploads a retained build-record artifact.
      DOCKER_BUILD_RECORD_UPLOAD: "false"

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify source, immutable bases, version, and license inputs
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          project = tomllib.loads((root / "pyproject.toml").read_text())["project"]
          version = project["version"]
          expected_tag = f"v{version}"
          revision = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          if len(revision) != 40:
              raise SystemExit(f"Checkout revision is not a full SHA: {revision!r}")
          dirty = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=normal"],
              text=True,
          ).strip()
          if dirty:
              raise SystemExit(f"Checkout is not clean:\n{dirty}")

          if project.get("license") != "LicenseRef-OpenQP-Research-1.0":
              raise SystemExit(
                  "project.license must be LicenseRef-OpenQP-Research-1.0"
              )
          for filename in (
              "LICENSE",
              "LICENSING.md",
              "SUSTAINABILITY.md",
              "THIRD_PARTY_NOTICES.md",
          ):
              path = root / filename
              if not path.is_file() or not path.read_bytes():
                  raise SystemExit(f"Required legal file missing or empty: {filename}")

          lock = json.loads((root / "docker/base-images.lock.json").read_text())
          dockerfile = (root / "Dockerfile").read_text()
          for stage in ("builder", "runtime"):
              image = lock["images"][stage]
              pinned = f"{image['reference']}@{image['digest']}"
              expected_from = f"FROM {pinned} AS {stage}"
              if expected_from not in dockerfile:
                  raise SystemExit(
                      f"Dockerfile {stage} does not match base lock: {expected_from}"
                  )
              if image.get("platform") != "linux/amd64":
                  raise SystemExit(f"Unexpected locked {stage} platform: {image}")
          if "--base-lock=docker/base-images.lock.json" not in dockerfile:
              raise SystemExit(
                  "Dockerfile OpenBLAS runtime check does not match the base lock"
              )

          if os.environ["EVENT_NAME"] == "release":
              release_tag = os.environ["RELEASE_TAG"]
              if release_tag != expected_tag:
                  raise SystemExit(
                      f"Release tag {release_tag!r} != package tag {expected_tag!r}"
                  )
              tagged_revision = subprocess.check_output(
                  ["git", "rev-parse", f"{release_tag}^{{commit}}"], text=True
              ).strip()
              if tagged_revision != revision:
                  raise SystemExit(
                      f"Checkout {revision} is not exact tag {release_tag} "
                      f"({tagged_revision})"
                  )

          print(f"version={version}")
          print(f"docker_tag={expected_tag}")
          print(f"revision={revision}")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build attested OCI candidate without publishing
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          tags: openqp/openqp:${{ steps.source.outputs.docker_tag }}
          build-args: |
            OPENQP_VERSION=${{ steps.source.outputs.version }}
            OPENQP_REVISION=${{ steps.source.outputs.revision }}
          outputs: type=oci,dest=${{ runner.temp }}/openqp-${{ steps.source.outputs.docker_tag }}.oci.tar
          sbom: true
          provenance: mode=max
          push: false

      - name: Verify OCI labels, digest, SBOM, and provenance
        env:
          OCI_ARCHIVE: ${{ runner.temp }}/openqp-${{ steps.source.outputs.docker_tag }}.oci.tar
          OCI_SUMMARY: ${{ runner.temp }}/openqp-${{ steps.source.outputs.docker_tag }}.oci.json
          OPENQP_VERSION: ${{ steps.source.outputs.version }}
          OPENQP_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          python .github/scripts/verify_oci_artifact.py \
            "$OCI_ARCHIVE" \
            --version "$OPENQP_VERSION" \
            --revision "$OPENQP_REVISION" \
            --summary "$OCI_SUMMARY"
          cat "$OCI_SUMMARY"

      # The OCI archive remains only on the ephemeral runner and is discarded
      # after verification.  A future protected publication job must rebuild
      # from the same exact tag/SHA and then verify its registry digest.
