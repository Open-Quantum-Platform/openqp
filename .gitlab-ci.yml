workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - preflight
  - native
  - regression

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  OQP_REUSE_EXTERNALS: "ON"
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

.linux-native:
  image: python:3.11-bookworm
  tags:
    - small-linux
  timeout: 4h
  before_script:
    - apt-get update
    - >-
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      gcc-12 g++-12 gfortran-12 libopenblas64-dev libopenmpi-dev openmpi-bin
      ninja-build pkg-config git ca-certificates
    - python -m venv "$CI_PROJECT_DIR/.venv-ci"
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install --upgrade pip cmake ninja
    - export PATH="$CI_PROJECT_DIR/.venv-ci/bin:$PATH"
    - mkdir -p "$CI_PROJECT_DIR/.tmp/$CI_JOB_NAME" "$OQP_EXTERNALS_ROOT"
  cache:
    key: "openqp-linux-$CI_RUNNER_ID-gcc12-openblas64-v2"
    paths:
      - .cache/pip/
      - .cache/openqp/
    policy: pull-push

source-policy:
  stage: preflight
  image: python:3.11-bookworm
  tags:
    - small-linux
  script:
    - python -m compileall -q pyoqp tests tools
    - python tools/check_blas_wrapper.py
    - >-
      if grep -nE 'git[[:space:]]+p[u]sh|git[[:space:]]+c[o]mmit' .gitlab-ci.yml; then
      echo 'CI configuration must not commit or push source'; exit 1; fi
    - >-
      if grep -nE 'LINALG_LIB=[Nn]et[Ll]ib|LINALG_LIB_INT6[4]' .gitlab-ci.yml; then
      echo 'LP64/NetLib CI configuration is forbidden'; exit 1; fi

linux-openblas64-full:
  extends: .linux-native
  stage: native
  variables:
    CC: gcc-12
    CXX: g++-12
    FC: gfortran-12
    OQP_EXTERNALS_ROOT: "$CI_PROJECT_DIR/.cache/openqp/externals/$CI_RUNNER_ID"
    TMPDIR: "$CI_PROJECT_DIR/.tmp/linux-openblas64-full"
  script:
    - set -o pipefail
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install -v . --no-deps --force-reinstall
      --config-settings=cmake.build-type=Release
      --config-settings=cmake.define.LINALG_LIB=OpenBLAS
      --config-settings=cmake.define.USE_LIBINT=OFF
      --config-settings=cmake.define.ENABLE_OPENMP=ON
      --config-settings=cmake.define.ENABLE_OPENTRAH=OFF
      --config-settings=cmake.define.ENABLE_DDX=ON
      --config-settings=cmake.define.ENABLE_MPI=OFF
      --config-settings=cmake.define.OQP_REUSE_EXTERNALS=ON
      --config-settings=cmake.define.OQP_EXTERNALS_ROOT="$OQP_EXTERNALS_ROOT"
      2>&1 | tee build-linux-openblas64.log
    - >-
      ! grep -Eiq "Performing (download|build) step for ['\"]?libint|Building Libint"
      build-linux-openblas64.log
    - grep -Eiq 'OpenBLAS.*(ILP64|8-byte)|(ILP64|8-byte).*OpenBLAS' build-linux-openblas64.log
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install
      -r pyoqp/requirements.txt 'numpy<2.2' geometric basis_set_exchange
      pytest pytest-xdist pytest-forked
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -c "import oqp; print(oqp.__file__)"
    - export OPENQP_ROOT="$("$CI_PROJECT_DIR/.venv-ci/bin/python" -c 'import oqp,os; print(os.path.dirname(oqp.__file__))' | tail -n1)"
    - export LD_LIBRARY_PATH="$(dirname "$(find "$OQP_EXTERNALS_ROOT" -name 'libddx.so*' -print -quit)"):${LD_LIBRARY_PATH:-}"
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/openqp" --validate_examples
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/openqp" --check_feature_coverage
    - set -o pipefail
    - OQP_TEST_OMP_THREADS=1 "$CI_PROJECT_DIR/.venv-ci/bin/openqp" --run_tests all 2>&1 | tee run-tests-all.log
    - >-
      OQP_REQUIRE_NATIVE_TESTS=1 "$CI_PROJECT_DIR/.venv-ci/bin/python"
      -m pytest tests -q -n auto --forked --tb=short -rf
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build-linux-openblas64.log
      - run-tests-all.log
      - openqp_test_tmp*/test_report.txt

linux-openblas64-mpi:
  extends: .linux-native
  stage: native
  variables:
    CC: gcc-12
    CXX: g++-12
    FC: gfortran-12
    OQP_EXTERNALS_ROOT: "$CI_PROJECT_DIR/.cache/openqp/externals/$CI_RUNNER_ID"
    TMPDIR: "$CI_PROJECT_DIR/.tmp/linux-openblas64-mpi"
  script:
    - set -o pipefail
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install -v . --no-deps --force-reinstall
      --config-settings=cmake.build-type=Release
      --config-settings=cmake.define.LINALG_LIB=OpenBLAS
      --config-settings=cmake.define.USE_LIBINT=OFF
      --config-settings=cmake.define.ENABLE_OPENMP=ON
      --config-settings=cmake.define.ENABLE_OPENTRAH=OFF
      --config-settings=cmake.define.ENABLE_DDX=OFF
      --config-settings=cmake.define.ENABLE_MPI=ON
      --config-settings=cmake.define.OQP_REUSE_EXTERNALS=ON
      --config-settings=cmake.define.OQP_EXTERNALS_ROOT="$OQP_EXTERNALS_ROOT"
      2>&1 | tee build-linux-openblas64-mpi.log
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install
      -r pyoqp/requirements.txt 'numpy<2.2' basis_set_exchange mpi4py
    - test_dir="$(mktemp -d)"
    - cp examples/QUANTUM/h2.inp "$test_dir/banner.inp"
    - >-
      OMPI_ALLOW_RUN_AS_ROOT=1 OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
      mpiexec --oversubscribe -n 2 "$CI_PROJECT_DIR/.venv-ci/bin/openqp"
      "$test_dir/banner.inp" --silent
    - >-
      test "$(grep -c 'OpenQP: Open Quantum Platform' "$test_dir/banner.log")" -eq 1
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build-linux-openblas64-mpi.log

.macos-accelerate-native:
  stage: native
  timeout: 4h
  variables:
    OQP_REUSE_EXTERNALS: "ON"
    CMAKE_BUILD_PARALLEL_LEVEL: "4"
  before_script:
    - export PATH="$HOMEBREW_PREFIX/bin:$HOMEBREW_PREFIX/opt/python@3.11/libexec/bin:/usr/bin:/bin:/usr/sbin:/sbin"
    - test "$(uname -m)" = "$EXPECTED_ARCH"
    - >-
      "$HOMEBREW_PREFIX/bin/python3.11" --version
    - >-
      "$HOMEBREW_PREFIX/bin/gfortran-15" --version
    - export OQP_EXTERNALS_ROOT="$HOME/Library/Caches/openqp-ci/gitlab/$EXPECTED_ARCH/externals"
    - mkdir -p "$OQP_EXTERNALS_ROOT" "$CI_PROJECT_DIR/.tmp/$CI_JOB_NAME"
    - >-
      "$HOMEBREW_PREFIX/bin/python3.11" -m venv "$CI_PROJECT_DIR/.venv-ci"
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install --upgrade pip cmake ninja
    - export PATH="$CI_PROJECT_DIR/.venv-ci/bin:$PATH"
  script:
    - set -o pipefail
    - >-
      CMAKE_ARGS="-DCMAKE_C_COMPILER=$HOMEBREW_PREFIX/bin/gcc-15
      -DCMAKE_CXX_COMPILER=$HOMEBREW_PREFIX/bin/g++-15
      -DCMAKE_Fortran_COMPILER=$HOMEBREW_PREFIX/bin/gfortran-15
      -DUSE_LIBINT=OFF -DENABLE_OPENMP=ON -DLINALG_LIB=auto
      -DENABLE_OPENTRAH=OFF -DOQP_REUSE_EXTERNALS=ON
      -DOQP_EXTERNALS_ROOT=$OQP_EXTERNALS_ROOT"
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install -v . --no-deps --force-reinstall
      2>&1 | tee "build-macos-$EXPECTED_ARCH.log"
    - >-
      ! grep -Eiq "Performing (download|build) step for ['\"]?libint|Building Libint"
      "build-macos-$EXPECTED_ARCH.log"
    - grep -Eiq 'Apple Accelerate.*ILP64|Accelerate ILP64|NEWLAPACK.*ILP64' "build-macos-$EXPECTED_ARCH.log"
    - >-
      LIBOQP="$(find "$CI_PROJECT_DIR/.venv-ci/lib/python3.11/site-packages/oqp/lib"
      -name 'liboqp*.dylib' -print -quit)"
    - test -n "$LIBOQP"
    - otool -L "$LIBOQP" | grep -q 'Accelerate.framework'
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/python" -m pip install
      -r pyoqp/requirements.txt 'numpy<2.2' geometric basis_set_exchange
      pytest pytest-xdist pytest-forked
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/openqp" --validate_examples
    - >-
      "$CI_PROJECT_DIR/.venv-ci/bin/openqp" --check_feature_coverage
    - set -o pipefail
    - >-
      OQP_TEST_OMP_THREADS=1 "$CI_PROJECT_DIR/.venv-ci/bin/openqp"
      --run_tests all 2>&1 | tee "run-tests-macos-$EXPECTED_ARCH.log"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build-macos-*.log
      - run-tests-macos-*.log
      - openqp_test_tmp*/test_report.txt

macos-intel-accelerate-ilp64:
  extends: .macos-accelerate-native
  tags:
    - macos-intel
    - zeus
  variables:
    HOMEBREW_PREFIX: /usr/local
    EXPECTED_ARCH: x86_64

macos-arm64-accelerate-ilp64:
  extends: .macos-accelerate-native
  tags:
    - macos-arm64
    - macmaster
  variables:
    HOMEBREW_PREFIX: /opt/homebrew
    EXPECTED_ARCH: arm64

windows-intel-mkl-ilp64:
  stage: native
  tags:
    - windows
    - winserver1
  timeout: 4h
  needs:
    - source-policy
  script:
    - |
      $oneapi = 'C:\Program Files (x86)\Intel\oneAPI\setvars.bat'
      if (-not (Test-Path $oneapi)) { throw "Intel oneAPI setvars.bat is missing" }
      $envLines = & cmd.exe /d /s /c "`"$oneapi`" --force >nul && set"
      foreach ($line in $envLines) {
        if ($line -match '^([^=]+)=(.*)$') {
          [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
        }
      }
      $python = 'C:\Program Files\Python311\python.exe'
      if (-not (Test-Path $python)) { throw "Python 3.11 is missing" }
      & $python -m venv .venv-windows-native
      $venvPython = "$env:CI_PROJECT_DIR\.venv-windows-native\Scripts\python.exe"
      $venvPip = "$env:CI_PROJECT_DIR\.venv-windows-native\Scripts\pip.exe"
      $env:PATH = "$env:CI_PROJECT_DIR\.venv-windows-native\Scripts;$env:PATH"
      $env:CC = 'icx'
      $env:CXX = 'icx'
      $env:FC = 'ifx'
      $env:CMAKE_GENERATOR = 'Ninja'
      $env:CMAKE_BUILD_PARALLEL_LEVEL = '4'
      $env:OQP_REUSE_EXTERNALS = 'ON'
      $env:OQP_EXTERNALS_ROOT = 'C:\oqp-gitlab-cache\externals'
      $buildDir = "C:\oqp-gitlab-build\$env:CI_PIPELINE_ID"
      $tempDir = "C:\oqp-gitlab-temp\$env:CI_PIPELINE_ID"
      $env:TEMP = $tempDir
      $env:TMP = $tempDir
      New-Item -ItemType Directory -Force -Path $env:OQP_EXTERNALS_ROOT,$buildDir,$tempDir | Out-Null
      & $venvPython -m pip install --upgrade pip cmake ninja numpy cffi scikit-build-core
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & $venvPython -m pip install -v . --no-build-isolation --no-deps --force-reinstall `
        --config-settings=build-dir=$buildDir `
        --config-settings=cmake.define.LINALG_LIB=Intel10_64ilp `
        --config-settings=cmake.define.ENABLE_MPI=OFF `
        --config-settings=cmake.define.ENABLE_OPENMP=ON `
        --config-settings=cmake.define.USE_LIBINT=OFF `
        --config-settings=cmake.define.ENABLE_OPENTRAH=OFF `
        --config-settings=cmake.define.OQP_REUSE_EXTERNALS=ON `
        --config-settings=cmake.define.OQP_EXTERNALS_ROOT=$env:OQP_EXTERNALS_ROOT `
        2>&1 | Tee-Object -FilePath build-windows-intel-mkl-ilp64.log
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if (Select-String -Path build-windows-intel-mkl-ilp64.log -Pattern 'Building Libint|Performing (download|build) step for .*libint' -Quiet) {
        throw "Libint build was unexpectedly enabled"
      }
      if (-not (Select-String -Path build-windows-intel-mkl-ilp64.log -Pattern 'Intel10_64ilp|MKL.*ILP64|ILP64.*MKL' -Quiet)) {
        throw "MKL ILP64 configuration evidence is missing"
      }
      & $venvPython -m pip install -r pyoqp\requirements.txt 'numpy<2.2' basis_set_exchange geometric pytest
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & "$env:CI_PROJECT_DIR\.venv-windows-native\Scripts\openqp.exe" --validate_examples
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & "$env:CI_PROJECT_DIR\.venv-windows-native\Scripts\openqp.exe" --run_tests all 2>&1 | Tee-Object -FilePath run-tests-windows-intel.log
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - build-windows-intel-mkl-ilp64.log
      - run-tests-windows-intel.log

windows-source-regression:
  stage: regression
  tags:
    - windows
    - winserver1
  timeout: 1h
  needs:
    - source-policy
  script:
    - py -3.11 -m venv .venv-windows-ci
    - .\.venv-windows-ci\Scripts\python.exe -m pip install --upgrade pip
    - >-
      .\.venv-windows-ci\Scripts\python.exe -m pip install
      -r pyoqp\requirements.txt "numpy<2.2" basis_set_exchange cmake pytest pytest-forked
    - $env:PYTHONUTF8 = "1"
    - $env:PATH = "$env:CI_PROJECT_DIR\.venv-windows-ci\Scripts;$env:PATH"
    - $env:PYTHONPATH = "$env:CI_PROJECT_DIR\pyoqp"
    - .\.venv-windows-ci\Scripts\python.exe -m compileall -q pyoqp tests tools
    - >-
      .\.venv-windows-ci\Scripts\python.exe -m pytest -q --tb=short -rf
      tests\test_cmake_mpi_linking.py
      tests\test_ddx_cmake_scaffold.py
      tests\test_opentrustregion_linalg_config.py
      tests\test_oqp_input_schema_manifest.py
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .pytest_cache/
