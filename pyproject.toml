[build-system]
requires = [
  "scikit-build-core>=0.11.4",
  "cmake>=3.25",
  "ninja",
  "numpy",
  "cffi",
  "setuptools>=61.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "OpenQP"
version = "1.3.0"
description = "Python bindings for the Open Quantum Platform (Fortran core + Python wrapper)"
authors = [
  { name = "Mohsen Mazaherifar", email = "moh.mazaheri@gmail.com" },
  { name = "Alireza Lashkaripour" },
]
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-OpenQP-Research-1.0"
license-files = [
  "LICENSE",
  "LICENSING.md",
  "SUSTAINABILITY.md",
  "THIRD_PARTY_NOTICES.md",
  "licenses/third_party/*",
]

dependencies = [
  "numpy>=1.20.0",
  "scipy>=1.10.0",
  "cffi>=1.16.0",
#  "mpi4py>=4.0.0",
  "basis_set_exchange",
  # Windows wheels link MKL ILP64 but do not carry it -- libmkl_core alone
  # exceeds PyPI's per-file limit.  Intel publishes it, so let pip install it
  # alongside; pyoqp/oqp/runtime.py adds its DLL directory to the search path.
  # `mkl` pulls in `intel-openmp`, which supplies the single libiomp5md the
  # process should have.
  # Pinned to the oneAPI series the wheel is COMPILED against
  # (.github/actions/setup-oneapi-windows).  MKL embeds versioned DLL names in
  # its import libraries -- liboqp.dll references mkl_core.2.dll and friends,
  # and those names change between releases -- so an older runtime that
  # satisfies a loose lower bound can leave liboqp unable to load.  CI has only
  # ever resolved and tested mkl 2026.1.  Bump this together with the oneAPI
  # version in the Windows workflows.
  'mkl>=2026.1,<2027; sys_platform == "win32"',
]

[project.optional-dependencies]
geometric = ["geometric>=1.0"]

[project.scripts]
openqp = "oqp.pyoqp:main"

[tool.scikit-build]
minimum-version = "0.11.4"
build.verbose = true
wheel.install-dir = "oqp"
wheel.packages = ["pyoqp/oqp"]

[tool.scikit-build.cmake.define]
USE_LIBINT = "OFF"
ENABLE_OPENMP = "ON"
ENABLE_OPENTRAH = "OFF"
CMAKE_INSTALL_LIBDIR = "lib"
# LINALG_LIB is intentionally NOT pinned here: CMake's native-BLAS platform
# policy resolves it per OS/arch -- macOS -> Accelerate ($NEWLAPACK$ILP64);
# Linux x86_64 -> MKL; Linux aarch64 -> OpenBLAS -- so a plain `pip install .`
# is deterministic per platform. OpenQP is ILP64-only (8-byte integers
# everywhere, unconditional). Override the backend per-build if needed:
#   pip install . -C cmake.define.LINALG_LIB=OpenBLAS
CMAKE_INSTALL_PREFIX = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

